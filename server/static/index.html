<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sceance</title>
  <link rel="stylesheet" href="/style.css" />
  <script src="https://unpkg.com/@daily-co/daily-js"></script>
</head>
<body>
  <main>
    <h1>Sceance</h1>
    <p class="intro">
      Choose who you'd like to speak with.
    </p>

    <div id="agents" class="agents">loading…</div>

    <button id="hangup-btn" class="secondary hidden">Hang up</button>

    <div id="status" class="status idle">ready</div>

    <p class="note">
      You'll be asked to allow microphone access. Use headphones if you
      can — it helps the conversation breathe.
    </p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
