[project]
name = "pipecat-quickstart"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[anthropic,cartesia,daily,deepgram,openai,runner,silero,webrtc]>=1.2.1",
    "pipecatcloud",
    "asyncpg>=0.29",
    "pyjwt[crypto]>=2.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pyright>=1.1.404,<2",
    "ruff>=0.12.11,<1",
]

[tool.uv]
# onnxruntime dropped Intel-Mac (x86_64) wheels after 1.23.0; Pipecat 1.x
# declares onnxruntime>=1.24.3 but Silero VAD only uses the stable
# InferenceSession API, so 1.23.0 works on this Intel Mac.
override-dependencies = ["onnxruntime==1.23.0"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
